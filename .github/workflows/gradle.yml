name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # Use Intel macOS while the arm64 hosted pool has runner-acquisition failures.
        platform: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew check coverage --init-script .github/ci-test-diagnostics.init.gradle

      # JavaFX UI tests need a display, which Linux runners lack.
      - name: Build and check with Gradle (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew check coverage

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.platform }}
          path: |
            build/test-results/
            build/reports/tests/
            **/hs_err_pid*.log
            **/replay_pid*.log
            ~/Library/Logs/DiagnosticReports/java*
          retention-days: 7
